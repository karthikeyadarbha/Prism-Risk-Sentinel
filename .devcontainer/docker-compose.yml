services:
  # Object Storage (S3 Replacement)
  minio:
    image: minio/minio:latest
    container_name: sentinel_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: sentinel_password
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_storage:/data  # This maps a folder in your project to MinIO

  # Distributed Compute (Spark Master)
  spark-master:
    image: apache/spark:3.5.0
    container_name: sentinel_spark_master
    user: root
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # Distributed Compute (Spark Worker)
  spark-worker:
    image: apache/spark:3.5.0
    container_name: sentinel_spark_worker
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
